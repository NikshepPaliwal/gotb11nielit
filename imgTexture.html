<!DOCTYPE html>
<html>
<head>
<title>First VR Page</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
<a-scene>
   
   <a-sphere position="0 1 -3" color="white"  radius="0.5" src="sun.jpg"></a-sphere>
   <a-text value="Sun" position="-0.2 0.2 -3" color="blue"></a-text>

    <a-sphere position="-2 1 -3"  radius="0.3" src="earth_scaled.jpg"></a-sphere>
    <a-text value="Earth" position="-2 0.5 -3" color="blue"></a-text>

    <a-sphere position="-1.7 1 -4" color="white"  radius="0.1" src="moonimg_scaled.jpg"></a-sphere>
    <a-text value="Moon" position="-3 0.2 -6" color="blue"></a-text>

    <a-sphere position="2 1 -3" color="white"  radius="0.3" src="mars.jpg"></a-sphere>
    <a-text value="Mars" position="2 0.5 -3" color="blue"></a-text>

</a-scene>
</body>
</html>
