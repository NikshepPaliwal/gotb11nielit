<!DOCTYPE html>
<html>
<head>
<title>First VR Page</title>
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
<a-scene>
    <a-box position="0 1 -3" rotation="0 45 0" color="#ED4624"></a-box>
    <a-sphere position="2 1 -5" radius="1.25" color="#EF2D5E"></a-sphere>
    <a-cylinder position="-2 0.75 -5" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
    <a-plane position="0 0 -4" rotation="-90 0 0" color="#7BC8A4" height="4" width="4"></a-plane>

</a-scene>
</body>
</html>
